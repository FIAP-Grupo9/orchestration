# Placeholder substituído por envsubst a partir do GitHub Secret
# MONGODB_ROOT_PASSWORD na pipeline de deploy, antes do kubectl apply.
# Em produção: use SealedSecrets, External Secrets Operator ou injete via CSI Driver.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: fcg
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "fcg_mongo"
  MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"
