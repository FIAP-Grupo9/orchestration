apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fcg
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            # subPath em ambos: montar o diretório inteiro esconderia os demais
            # arquivos de configuração da imagem.
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
            - name: conf
              mountPath: /etc/rabbitmq/conf.d/10-definitions.conf
              subPath: 10-definitions.conf
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            # Em VMs burstable (ex. Azure Standard_B2s), rabbitmq-diagnostics
            # inicia sua própria VM Erlang a cada chamada e pode passar de 1s
            # (default do K8s), derrubando o pod via falha de probe antes de
            # ele terminar de subir.
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: definitions
          configMap:
            name: rabbitmq-definitions
        - name: conf
          configMap:
            name: rabbitmq-conf
