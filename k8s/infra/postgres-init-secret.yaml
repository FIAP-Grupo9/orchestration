# Este arquivo contém senhas, por isso é um Secret (não ConfigMap), montado
# como volume do mesmo jeito. Os placeholders são substituídos por envsubst
# a partir dos GitHub Secrets na pipeline de deploy antes do kubectl apply.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-init
  namespace: fcg
type: Opaque
stringData:
  01-init-databases.sql: |
    CREATE DATABASE users_db;
    CREATE DATABASE catalog_db;
    CREATE DATABASE payments_db;

    CREATE USER users_user    WITH PASSWORD '${USERS_DB_PASSWORD}';
    CREATE USER catalog_user  WITH PASSWORD '${CATALOG_DB_PASSWORD}';
    CREATE USER payments_user WITH PASSWORD '${PAYMENTS_DB_PASSWORD}';

    GRANT ALL PRIVILEGES ON DATABASE users_db    TO users_user;
    GRANT ALL PRIVILEGES ON DATABASE catalog_db  TO catalog_user;
    GRANT ALL PRIVILEGES ON DATABASE payments_db TO payments_user;

    \c users_db
    GRANT ALL ON SCHEMA public TO users_user;
    ALTER SCHEMA public OWNER TO users_user;

    \c catalog_db
    GRANT ALL ON SCHEMA public TO catalog_user;
    ALTER SCHEMA public OWNER TO catalog_user;

    \c payments_db
    GRANT ALL ON SCHEMA public TO payments_user;
    ALTER SCHEMA public OWNER TO payments_user;
