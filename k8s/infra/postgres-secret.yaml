# Valor de POSTGRES_PASSWORD é um placeholder: a pipeline de deploy substitui
# por envsubst a partir do GitHub Secret POSTGRES_ROOT_PASSWORD antes do
# kubectl apply. Nunca commitar a senha real aqui. Ver README.md > CI/CD.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fcg
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "${POSTGRES_ROOT_PASSWORD}"
  POSTGRES_DB: "postgres"
