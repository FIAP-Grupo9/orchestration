# Datasource e dashboards provisionados por arquivo: o Grafana sobe com tudo
# pronto, sem nenhum passo manual, e a configuração fica versionada no Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: fcg
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # uid fixo para que o JSON do dashboard possa referenciá-lo de forma
        # estável, em vez de depender de um identificador gerado no primeiro boot.
        uid: fcg-prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fcg
        orgId: 1
        folder: FCG
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
