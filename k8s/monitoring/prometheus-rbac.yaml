# O Prometheus descobre os alvos consultando a API do Kubernetes, então precisa
# de permissão de leitura sobre pods, services e endpoints.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: fcg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fcg-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fcg-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fcg-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: fcg
