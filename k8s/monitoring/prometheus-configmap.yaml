apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fcg
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Descoberta por annotation, e não por lista fixa de alvos: um serviço novo
      # entra no monitoramento apenas anotando o pod com prometheus.io/scrape.
      - job_name: fcg-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fcg]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

          # "app" é o label pelo qual os painéis do Grafana agrupam por serviço.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
