# Placeholder substituído por envsubst a partir do GitHub Secret
# GRAFANA_ADMIN_PASSWORD na pipeline de deploy, antes do kubectl apply.
# Em produção: use SealedSecrets, External Secrets Operator ou injete via CSI Driver.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: fcg
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
