name: fcg

services:
  postgres:
    image: postgres:15-alpine
    container_name: fcg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fcg-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fcg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-net
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: fcg-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: fcg_mongo
      MONGO_INITDB_ROOT_PASSWORD: fcg_mongo_pwd
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - fcg-net
    restart: unless-stopped

  users-api:
    build:
      context: ../fcg-users-api
      dockerfile: Dockerfile
    container_name: fcg-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users_db;Username=users_user;Password=users_pwd"
      JwtSettings__Issuer: FCG.UsersAPI
      JwtSettings__Audience: FCG.Services
      JwtSettings__Secret: ${JWT_SECRET:-fcg-dev-secret-change-me-minimum-32-chars}
      JwtSettings__ExpirationHours: "8"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      SeedData__Enabled: "true"
      SeedData__AdminEmail: admin@fcg.com
      SeedData__AdminPassword: Admin@1234
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-net
    restart: unless-stopped

  catalog-api:
    build:
      context: ../fcg-catalog-api
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=catalog_db;Username=catalog_user;Password=catalog_pwd"
      JwtSettings__Issuer: FCG.UsersAPI
      JwtSettings__Audience: FCG.Services
      JwtSettings__Secret: ${JWT_SECRET:-fcg-dev-secret-change-me-minimum-32-chars}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      MongoDb__ConnectionString: "mongodb://fcg_mongo:fcg_mongo_pwd@mongodb:27017"
      MongoDb__Database: "catalog"
      Redis__ConnectionString: "redis:6379"
      SeedData__Enabled: "true"
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fcg-net
    restart: unless-stopped

  payments-api:
    build:
      context: ../fcg-payments-api
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=payments_db;Username=payments_user;Password=payments_pwd"
      JwtSettings__Issuer: FCG.UsersAPI
      JwtSettings__Audience: FCG.Services
      JwtSettings__Secret: ${JWT_SECRET:-fcg-dev-secret-change-me-minimum-32-chars}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-net
    restart: unless-stopped

# A NotificationsAPI foi substituída pela função serverless fcg-notifications-fn,
# que depende do KEDA para escalar a partir de zero e por isso só roda em
# Kubernetes. Neste docker-compose, portanto, os eventos de notificação ficam
# acumulados nas filas até que alguém os consuma — o que é esperado.
# Para o ambiente completo da Fase 3 (gateway, observabilidade e serverless),
# use o deploy em Kubernetes.

volumes:
  postgres_data:
  mongo_data:

networks:
  fcg-net:
    driver: bridge
